<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — ReadyMadeVideo</title>
    <meta name="robots" content="noindex">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --ink: #14100c; --muted: #6f665d; --sand: #f5efe6; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Inter", system-ui, sans-serif;
            background: var(--sand); color: var(--ink);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            text-align: center; padding: 24px;
        }
        .code { font-size: clamp(64px, 14vw, 120px); font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
        h1 { font-size: clamp(20px, 4vw, 28px); margin: 12px 0 10px; font-weight: 600; }
        p { color: var(--muted); margin-bottom: 28px; }
        a.btn {
            display: inline-block; background: var(--ink); color: var(--sand);
            padding: 13px 26px; border-radius: 10px; text-decoration: none; font-weight: 600;
        }
        a.btn:hover { opacity: .88; }
    </style>
</head>
<body>
    <div>
        <div class="code">404</div>
        <h1>That listing isn't here.</h1>
        <p>The page you're looking for moved or never existed. The good stuff is back on the homepage.</p>
        <a class="btn" href="/">Back to ReadyMadeVideo</a>
    </div>
</body>
</html>
